{% if pagina.has_other_pages %}
<nav class="pagination" aria-label="Paginação">
    {% if pagina.has_previous %}<a class="btn btn-small" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ pagina.previous_page_number }}">← Anterior</a>{% endif %}
    <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
    {% if pagina.has_next %}<a class="btn btn-small" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ pagina.next_page_number }}">Próxima →</a>{% endif %}
</nav>
{% endif %}
