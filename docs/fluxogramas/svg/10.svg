<text x="465.0" y="753.3" font-size="11.5" text-anchor="middle" fill="#22202a" font-weight="bold">Receber, estornar ou</text>
<text x="465.0" y="766.8" font-size="11.5" text-anchor="middle" fill="#22202a" font-weight="bold">cancelar?</text>
<polygon points="124.0,844.0 322.0,844.0 306.0,900.0 108.0,900.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
<text x="215.0" y="869.3" font-size="11.5" text-anchor="middle" fill="#22202a">Selecionar recebimento e</text>
<text x="215.0" y="882.8" font-size="11.5" text-anchor="middle" fill="#22202a">informar o motivo do estorno</text>
