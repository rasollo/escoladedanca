<text x="465.0" y="296.0" font-size="11.5" text-anchor="middle" fill="#22202a">Acessar mensalidades</text>
<polygon points="374.0,380.0 572.0,380.0 556.0,436.0 358.0,436.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
<text x="465.0" y="398.5" font-size="11.5" text-anchor="middle" fill="#22202a">Escolher mês ou período e</text>
<text x="465.0" y="412.0" font-size="11.5" text-anchor="middle" fill="#22202a">situação; exibir cobranças,</text>
<text x="465.0" y="425.5" font-size="11.5" text-anchor="middle" fill="#22202a">totais e contagem por situação</text>
<polygon points="465.0,480.0 572.0,524.0 465.0,568.0 358.0,524.0" fill="#fff4dc" stroke="#a8761a" stroke-width="1.5"/>
<text x="465.0" y="528.0" font-size="11.5" text-anchor="middle" fill="#22202a" font-weight="bold">Qual operação?</text>
