<text x="215.0" y="630.5" font-size="11.5" text-anchor="middle" fill="#22202a">Gerar 1 cobrança por matrícula</text>
<text x="215.0" y="644.0" font-size="11.5" text-anchor="middle" fill="#22202a">ativa sem cobrança no mês (o</text>
<text x="215.0" y="657.5" font-size="11.5" text-anchor="middle" fill="#22202a">caixa não muda)</text>
<polygon points="624.0,612.0 822.0,612.0 806.0,668.0 608.0,668.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
