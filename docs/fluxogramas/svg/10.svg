<text x="215.0" y="985.3" font-size="11.5" text-anchor="middle" fill="#22202a">Registrar saída de estorno</text>
<text x="215.0" y="998.8" font-size="11.5" text-anchor="middle" fill="#22202a">vinculada ao recebimento</text>
<polygon points="374.0,844.0 572.0,844.0 556.0,900.0 358.0,900.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
<text x="465.0" y="869.3" font-size="11.5" text-anchor="middle" fill="#22202a">Informar valor, data e forma</text>
<text x="465.0" y="882.8" font-size="11.5" text-anchor="middle" fill="#22202a">de pagamento</text>
<polygon points="465.0,944.0 572.0,988.0 465.0,1032.0 358.0,988.0" fill="#fff4dc" stroke="#a8761a" stroke-width="1.5"/>
<text x="465.0" y="985.3" font-size="11.5" text-anchor="middle" fill="#22202a" font-weight="bold">0 &lt; valor ≤ saldo</text>
