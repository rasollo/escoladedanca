<text x="36" y="1430" font-size="11.5" fill="#5a5768">O que mudou: v2.0: a mensalidade passou a ser uma cobrança mensal por matrícula ativa (mensalidade − desconto, vencimento no dia 5), que não altera o caixa. O recebimento pode ser parcial, até o saldo</text>
<text x="36" y="1445" font-size="11.5" fill="#5a5768">devedor, e entra como entrada; a correção é por estorno com motivo (saída vinculada); a cobrança só é cancelada sem recebimentos. A situação (pendente, parcial, atrasada ou paga) segue informativa (RN08).</text>
