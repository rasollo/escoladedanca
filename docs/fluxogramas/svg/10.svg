<text x="465.0" y="1094.5" font-size="11.5" text-anchor="middle" fill="#22202a">Registrar entrada (origem =</text>
<text x="465.0" y="1108.0" font-size="11.5" text-anchor="middle" fill="#22202a">mensalidade) vinculada à</text>
<text x="465.0" y="1121.5" font-size="11.5" text-anchor="middle" fill="#22202a">cobrança</text>
<rect x="363.0" y="1192.0" width="204" height="56" fill="#eef1fa" stroke="#4a5a8c" stroke-width="1.5"/>
<text x="465.0" y="1210.5" font-size="11.5" text-anchor="middle" fill="#22202a">Atualizar saldo e situação:</text>
<text x="465.0" y="1224.0" font-size="11.5" text-anchor="middle" fill="#22202a">pendente, parcial, atrasada ou</text>
<text x="465.0" y="1237.5" font-size="11.5" text-anchor="middle" fill="#22202a">paga</text>
<polygon points="965.0,828.0 1072.0,872.0 965.0,916.0 858.0,872.0" fill="#fff4dc" stroke="#a8761a" stroke-width="1.5"/>
