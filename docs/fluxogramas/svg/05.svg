<text x="465.0" y="869.3" font-size="11.5" text-anchor="middle" fill="#22202a">Abrir matrícula (início = hoje,</text>
<text x="465.0" y="882.8" font-size="11.5" text-anchor="middle" fill="#22202a">mensalidade da aula)</text>
