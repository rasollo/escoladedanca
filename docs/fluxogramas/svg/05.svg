<text x="465.0" y="296.0" font-size="11.5" text-anchor="middle" fill="#22202a">Selecionar aula agendada</text>
<polygon points="374.0,380.0 572.0,380.0 556.0,436.0 358.0,436.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
<text x="465.0" y="405.3" font-size="11.5" text-anchor="middle" fill="#22202a">Exibir inscritos, capacidade</text>
<text x="465.0" y="418.8" font-size="11.5" text-anchor="middle" fill="#22202a">da sala e vagas</text>
<polygon points="374.0,496.0 572.0,496.0 556.0,552.0 358.0,552.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
<text x="465.0" y="521.3" font-size="11.5" text-anchor="middle" fill="#22202a">Marcar alunos a inscrever e</text>
<text x="465.0" y="534.8" font-size="11.5" text-anchor="middle" fill="#22202a">desmarcar os que saíram</text>
<polygon points="465.0,596.0 572.0,640.0 465.0,684.0 358.0,640.0" fill="#fff4dc" stroke="#a8761a" stroke-width="1.5"/>
<text x="465.0" y="637.3" font-size="11.5" text-anchor="middle" fill="#22202a" font-weight="bold">Total de inscritos ≤</text>
<text x="465.0" y="650.8" font-size="11.5" text-anchor="middle" fill="#22202a" font-weight="bold">capacidade da sala?</text>
<rect x="613.0" y="612.0" width="204" height="56" fill="#eef1fa" stroke="#4a5a8c" stroke-width="1.5"/>
<text x="715.0" y="637.3" font-size="11.5" text-anchor="middle" fill="#22202a">Revisar seleção ou organizar</text>
<text x="715.0" y="650.8" font-size="11.5" text-anchor="middle" fill="#22202a">outra turma</text>
<rect x="363.0" y="728.0" width="204" height="56" fill="#eef1fa" stroke="#4a5a8c" stroke-width="1.5"/>
<text x="465.0" y="753.3" font-size="11.5" text-anchor="middle" fill="#22202a">Abrir matrícula (início = hoje)</text>
<text x="465.0" y="766.8" font-size="11.5" text-anchor="middle" fill="#22202a">de cada aluno marcado</text>
<rect x="363.0" y="844.0" width="204" height="56" fill="#eef1fa" stroke="#4a5a8c" stroke-width="1.5"/>
<text x="465.0" y="869.3" font-size="11.5" text-anchor="middle" fill="#22202a">Encerrar matrícula (fim = hoje)</text>
<text x="465.0" y="882.8" font-size="11.5" text-anchor="middle" fill="#22202a">de cada aluno desmarcado</text>
<rect x="363.0" y="960.0" width="204" height="56" fill="#eef1fa" stroke="#4a5a8c" stroke-width="1.5"/>
<text x="465.0" y="985.3" font-size="11.5" text-anchor="middle" fill="#22202a">Registrar a alteração na</text>
<text x="465.0" y="998.8" font-size="11.5" text-anchor="middle" fill="#22202a">auditoria</text>
<polygon points="374.0,1076.0 572.0,1076.0 556.0,1132.0 358.0,1132.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
