<text x="465.0" y="1114.8" font-size="11.5" text-anchor="middle" fill="#22202a">cálculo do salário (fluxo 11)</text>
<ellipse cx="465.0" cy="1220.0" rx="60.0" ry="21.0" fill="#e3f2ea" stroke="#2f7a55" stroke-width="1.5"/>
<text x="465.0" y="1224.0" font-size="11.5" text-anchor="middle" fill="#22202a" font-weight="bold">Fim</text>
<rect x="585.7" y="623.0" width="24.6" height="14" fill="#ffffff"/>
<text x="598.0" y="634.0" font-size="11" text-anchor="middle" fill="#3a3850" font-style="italic">Não</text>
<rect x="470.0" y="693.0" width="24.6" height="14" fill="#ffffff"/>
<text x="473.0" y="704.0" font-size="11" text-anchor="start" fill="#3a3850" font-style="italic">Sim</text>
<text x="36" y="1314" font-size="11.5" fill="#5a5768">O que mudou: Fluxo novo: a inscrição abre uma matrícula com data de início; a saída encerra a matrícula com data de fim. É a</text>
<text x="36" y="1329" font-size="11.5" fill="#5a5768">base do salário (fluxo 11). Não é exigida para participar (RN08).</text>
