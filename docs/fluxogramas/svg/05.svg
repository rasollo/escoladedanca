<text x="1098.0" y="518.0" font-size="11" text-anchor="middle" fill="#3a3850" font-style="italic">Reativar</text>
<text x="36" y="1430" font-size="11.5" fill="#5a5768">O que mudou: v2.0: a matrícula copia a mensalidade da aula e aceita desconto percentual ou fixo (RN18); o Administrativo pode suspender ou cancelar com motivo e reativar a suspensa, respeitando a</text>
<text x="36" y="1445" font-size="11.5" fill="#5a5768">lotação (RF32, RN20). Matrículas encerradas não geram novas cobranças, mas contam no salário do mês em que estiveram ativas.</text>
