<text x="465.0" y="282.5" font-size="11.5" text-anchor="middle" fill="#22202a" font-weight="bold">Vincular alunos ou</text>
<text x="465.0" y="296.0" font-size="11.5" text-anchor="middle" fill="#22202a" font-weight="bold">gerenciar uma</text>
<text x="465.0" y="309.5" font-size="11.5" text-anchor="middle" fill="#22202a" font-weight="bold">matrícula?</text>
<polygon points="374.0,380.0 572.0,380.0 556.0,436.0 358.0,436.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
<text x="465.0" y="405.3" font-size="11.5" text-anchor="middle" fill="#22202a">Selecionar aula agendada</text>
<text x="465.0" y="418.8" font-size="11.5" text-anchor="middle" fill="#22202a">(professor: só as próprias)</text>
<polygon points="374.0,496.0 572.0,496.0 556.0,552.0 358.0,552.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
<text x="465.0" y="521.3" font-size="11.5" text-anchor="middle" fill="#22202a">Exibir inscritos, capacidade</text>
<text x="465.0" y="534.8" font-size="11.5" text-anchor="middle" fill="#22202a">da sala e vagas</text>
<polygon points="374.0,612.0 572.0,612.0 556.0,668.0 358.0,668.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
<text x="465.0" y="637.3" font-size="11.5" text-anchor="middle" fill="#22202a">Marcar alunos a inscrever e</text>
<text x="465.0" y="650.8" font-size="11.5" text-anchor="middle" fill="#22202a">desmarcar os que saíram</text>
<polygon points="465.0,712.0 572.0,756.0 465.0,800.0 358.0,756.0" fill="#fff4dc" stroke="#a8761a" stroke-width="1.5"/>
