<text x="215.0" y="753.3" font-size="11.5" text-anchor="middle" fill="#22202a">Revisar seleção ou organizar</text>
<text x="215.0" y="766.8" font-size="11.5" text-anchor="middle" fill="#22202a">outra turma</text>
