<text x="465.0" y="1237.5" font-size="11.5" text-anchor="middle" fill="#22202a">salário (fluxo 11)</text>
<polygon points="874.0,380.0 1072.0,380.0 1056.0,436.0 858.0,436.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
<text x="965.0" y="405.3" font-size="11.5" text-anchor="middle" fill="#22202a">Abrir a matrícula no cadastro</text>
<text x="965.0" y="418.8" font-size="11.5" text-anchor="middle" fill="#22202a">do aluno (Administrativo)</text>
<polygon points="965.0,480.0 1072.0,524.0 965.0,568.0 858.0,524.0" fill="#fff4dc" stroke="#a8761a" stroke-width="1.5"/>
<text x="965.0" y="528.0" font-size="11.5" text-anchor="middle" fill="#22202a" font-weight="bold">Qual ação?</text>
<polygon points="624.0,612.0 822.0,612.0 806.0,668.0 608.0,668.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
<text x="715.0" y="637.3" font-size="11.5" text-anchor="middle" fill="#22202a">Ajustar mensalidade e desconto</text>
<text x="715.0" y="650.8" font-size="11.5" text-anchor="middle" fill="#22202a">(% ou valor fixo)</text>
<polygon points="874.0,612.0 1072.0,612.0 1056.0,668.0 858.0,668.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
<text x="965.0" y="637.3" font-size="11.5" text-anchor="middle" fill="#22202a">Escolher suspender ou cancelar</text>
<text x="965.0" y="650.8" font-size="11.5" text-anchor="middle" fill="#22202a">e informar o motivo</text>
<rect x="863.0" y="728.0" width="204" height="56" fill="#eef1fa" stroke="#4a5a8c" stroke-width="1.5"/>
<text x="965.0" y="753.3" font-size="11.5" text-anchor="middle" fill="#22202a">Encerrar a matrícula (fim =</text>
<text x="965.0" y="766.8" font-size="11.5" text-anchor="middle" fill="#22202a">hoje), sem novas cobranças</text>
<rect x="1113.0" y="612.0" width="204" height="56" fill="#eef1fa" stroke="#4a5a8c" stroke-width="1.5"/>
<text x="1215.0" y="637.3" font-size="11.5" text-anchor="middle" fill="#22202a">Conferir se está suspensa, se a</text>
<text x="1215.0" y="650.8" font-size="11.5" text-anchor="middle" fill="#22202a">aula está ativa e se há vaga</text>
<rect x="1113.0" y="728.0" width="204" height="56" fill="#eef1fa" stroke="#4a5a8c" stroke-width="1.5"/>
<text x="1215.0" y="753.3" font-size="11.5" text-anchor="middle" fill="#22202a">Nova matrícula (início = hoje)</text>
<text x="1215.0" y="766.8" font-size="11.5" text-anchor="middle" fill="#22202a">com a mesma mensalidade</text>
