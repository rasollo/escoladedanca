<text x="832.0" y="518.0" font-size="11" text-anchor="middle" fill="#3a3850" font-style="italic">Ajustar valor</text>
<rect x="970.0" y="577.0" width="55.6" height="14" fill="#ffffff"/>
<text x="973.0" y="588.0" font-size="11" text-anchor="start" fill="#3a3850" font-style="italic">Encerrar</text>
