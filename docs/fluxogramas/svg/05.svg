<text x="465.0" y="985.3" font-size="11.5" text-anchor="middle" fill="#22202a">Encerrar matrícula (fim = hoje)</text>
<text x="465.0" y="998.8" font-size="11.5" text-anchor="middle" fill="#22202a">dos desmarcados</text>
<rect x="363.0" y="1076.0" width="204" height="56" fill="#eef1fa" stroke="#4a5a8c" stroke-width="1.5"/>
<text x="465.0" y="1101.3" font-size="11.5" text-anchor="middle" fill="#22202a">Registrar a alteração na</text>
<text x="465.0" y="1114.8" font-size="11.5" text-anchor="middle" fill="#22202a">auditoria</text>
<polygon points="374.0,1192.0 572.0,1192.0 556.0,1248.0 358.0,1248.0" fill="#f5effb" stroke="#6a4a8c" stroke-width="1.5"/>
