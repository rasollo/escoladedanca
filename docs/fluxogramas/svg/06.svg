<text x="36" y="1763" font-size="11.5" fill="#5a5768">O que mudou: v2.0: a chamada de cada aula e data fica aberta, concluída ou cancelada (RF33). O professor registra e conclui a chamada das próprias aulas; uma</text>
<text x="36" y="1778" font-size="11.5" fill="#5a5768">chamada concluída só é corrigida pela administração, com motivo; a aula só é cancelada sem registros e com motivo (RN19). Mantidos os avulsos, o dia da aula e a</text>
<text x="36" y="1793" font-size="11.5" fill="#5a5768">capacidade.</text>
